<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} · Music Rating</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ea580c'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
    {% block head %}{% endblock %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="{{ url_for('index') }}" class="brand">
                <span class="logo">♪</span>
                <span class="full">Music Rating</span>
            </a>
            <div class="nav-links">
                <a href="{{ url_for('index') }}"
                   class="nav-link {% if request.endpoint in ['index', 'song_detail', 'edit_song'] %}active{% endif %}">Library</a>
                <a href="{{ url_for('statistics') }}"
                   class="nav-link {% if request.endpoint == 'statistics' %}active{% endif %}">Statistics</a>
                <a href="{{ url_for('add_song') }}"
                   class="nav-link {% if request.endpoint == 'add_song' %}active{% endif %}">+ Add Song</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='jquery-3.7.0.min.js') }}"></script>
    <script src="{{ url_for('static', filename='tablesorter-master/dist/js/jquery.tablesorter.min.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
